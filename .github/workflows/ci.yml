name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Structural sourcing checks: no uncited series, no drift between the
      # browser's fetch and the refresh script's.
      - name: Verify the source register
        run: npm run verify-sources

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
